[task]
name = "cg/mjcf-dynamics"
description = "Port MuJoCo 3.16.0's MJCF compiler, smooth rigid-body dynamics, integrators and sensors to a pure Python/NumPy package, graded against frozen MuJoCo outputs on hidden random models."

[metadata]
paradigm = "implementation"
compute = "cpu"
languages = ["python"]
category = "physics-simulation"
difficulty = "frontier"
tags = ["mujoco", "mjcf", "rigid-body-dynamics", "port", "numpy"]
oracle_reward_threshold = 1.0

[agent]
timeout_sec = 28800

[verifier]
timeout_sec = 7200

[environment]
allow_internet = false
cpus = 8
memory_mb = 16384
gpus = 0

[environment.env]
TASK_BUDGET_SECS = "28800"
